[tool.poetry]
name = "bankstatementparser-loader-mt942"
version = "0.0.19"
description = "SWIFT MT942 Interim Transaction Report loader that parses MT942 wire format into bankstatementparser Transaction objects."
authors = ["Sebastien Rousseau <sebastian.rousseau@gmail.com>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/sebastienrousseau/bankstatementparser-loader-mt942"
homepage = "https://bankstatementparser.com"
keywords = ["mt942", "swift", "bank", "statement", "interim-transaction-report", "cash-management"]
packages = [
    { include = "bankstatementparser_loader_mt942" },
]

[tool.poetry.plugins."bankstatementparser.loaders"]
mt942 = "bankstatementparser_loader_mt942.loader:Mt942StatementParser"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
bankstatementparser = ">=0.0.18"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3,<10.0.0"
pytest-cov = ">=6.0.0,<8.0.0"
black = "^26.3.1"
ruff = ">=0.1,<0.17"
mypy = ">=1.11,<3.0"
bandit = "^1.7.0"
interrogate = "^1.7.0"
mutmut = "^3.0"
# tests/test_suite_conformance.py parses pyproject.toml. tomllib is
# stdlib only from 3.11 and the suite floor is 3.10, so without the
# backport the conformance gate does not run there at all.
tomli = { version = ">=2", python = "<3.11" }
packaging = ">=23"
hypothesis = ">=6.82,<7"
[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mutmut]
# Mutation testing: prove the test suite actually *kills* injected bugs,
# not merely that every line executes (100% line coverage is weak
# evidence). We mutate only the loader package and run the test suite as
# the test command.
paths_to_mutate = ["bankstatementparser_loader_mt942/"]
tests_dir = ["tests/"]
# Run only the behavioural loader tests under mutation. The docs/version
# regression suites (test_docs_accuracy, test_regression_*) resolve paths
# relative to the real repo root and cannot run from mutmut's ``mutants/``
# sandbox copy; they assert documentation sync, not loader logic, so they
# are out of scope for mutation testing.
runner = "python -m pytest -x -q --no-header -p no:cacheprovider tests/test_loader.py tests/test_corpus.py tests/test_real_corpus.py"

# tests/test_suite_conformance.py is generated and vendored from one
# canonical copy shared across the suite, and checksummed by its own
# test. The suite uses three different line lengths, so letting each
# repository's formatter rewrite it would make the checksum
# unsatisfiable everywhere.
[tool.black]
extend-exclude = "tests/test_suite_conformance\\.py"
line-length = 79
target-version = ['py310']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short",
    # Coverage runs on a plain local `pytest`, not only in CI. Without
    # these a developer sees green and learns otherwise from the build.
    # The floor itself is NOT restated here: pytest-cov honours
    # fail_under from [tool.coverage.report], so the number lives in
    # exactly one place.
    "--cov=bankstatementparser_loader_mt942",
    "--cov-branch",
    "--cov-report=term-missing",
]

[tool.coverage.run]
branch = true
source = ["bankstatementparser_loader_mt942"]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "pragma: no cover",
    "@overload",
]
fail_under = 100
show_missing = true
skip_covered = false

[tool.interrogate]
fail-under = 100
ignore-init-method = true
ignore-semiprivate = false
ignore-private = false
ignore-magic = true
exclude = ["tests", "examples", "mutants"]

[tool.ruff]
line-length = 79
target-version = "py310"
extend-exclude = ["*.md", "tmp_env", ".venv", ".eggs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# A standalone benchmark has to put the repository on sys.path
# before importing the package it measures, so its imports cannot
# come first.
"benches/*.py" = ["E402"]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
strict_equality = true
exclude = [
    "tmp_env/",
    ".venv/",
    ".eggs/",
]

[[tool.mypy.overrides]]
module = "bankstatementparser.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The loader hands Decimal/date values to the (untyped) bankstatementparser
# ``Transaction.from_record`` mapping API, which propagates ``Any``. Relax the
# two strict checks that contact surface would trip while keeping the rest of
# strict mode in force.
module = "bankstatementparser_loader_mt942.*"
disallow_any_generics = false
warn_return_any = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
warn_unused_ignores = false
disable_error_code = ["arg-type", "return-value", "attr-defined", "assignment"]
