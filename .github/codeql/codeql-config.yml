name: "bankstatementparser-loader-mt942 CodeQL config"

# Examples and tests print sample MT942 data. Excluding them keeps the
# scan focused on production code in ``bankstatementparser_loader_mt942/``.
paths-ignore:
  - examples
  - tests

# Use the default + security-extended query suite so we get the same
# coverage GitHub's default setup would have offered.
queries:
  - uses: security-and-quality
