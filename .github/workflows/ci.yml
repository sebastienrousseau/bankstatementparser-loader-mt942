name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install this package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov interrogate

      - name: Run tests with the 100% coverage gate
        run: |
          # --cov, --cov-branch and the 100% floor all come from
          # pyproject.toml, so a local `pytest` enforces exactly this.
          # Only the XML report is CI-specific.
          pytest tests/ --cov-report=xml -v
          # Not a timing gate -- wall-clock is not comparable between
          # runners. This proves the benchmark still runs against the
          # current API rather than rotting into a file that reads as
          # verified and is not.
          python benches/bench_load_mt942.py --quick

      - name: Enforce 100% docstring coverage
        run: interrogate -c pyproject.toml bankstatementparser_loader_mt942

      - name: Upload coverage XML
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install this package + lint deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff black mypy

      - name: Ruff check
        run: ruff check bankstatementparser_loader_mt942/ tests/ examples/

      - name: Black check
        run: black --check bankstatementparser_loader_mt942/ tests/ benches/

      - name: Mypy
        run: mypy bankstatementparser_loader_mt942/

  examples:
    name: Examples
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install this package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run examples
        run: |
          python examples/01_load_mt942.py
          python examples/02_summarize_mt942.py

  smoke:
    name: Install smoke test (wheel)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install the wheel into a fresh virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/smoke/bin/python" -m pip install dist/*.whl

      - name: Import the installed package and print its version
        run: |
          "$RUNNER_TEMP/smoke/bin/python" -c "import bankstatementparser_loader_mt942 as m; print(m.__version__)"

      - name: Run an example from a neutral working directory
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/python" "$GITHUB_WORKSPACE/examples/01_load_mt942.py"
